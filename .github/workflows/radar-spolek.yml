name: Radar Spolek

on:
  push:
    branches: [master, "claude/radar-spolek**"]
    tags: ["radar-spolek-v*"]
    paths:
      - "radar-spolek/**"
      - ".github/workflows/radar-spolek.yml"
  pull_request:
    paths:
      - "radar-spolek/**"
      - ".github/workflows/radar-spolek.yml"
  workflow_dispatch:

concurrency:
  group: radar-spolek-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: radar-spolek

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK and unsigned release
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: radar-spolek-debug-apk
          path: radar-spolek/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: radar-spolek-reports
          path: radar-spolek/app/build/reports/
          if-no-files-found: ignore

  release:
    name: Signed release build
    needs: build
    # Pull requesty nie mają dostępu do klucza podpisu.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: radar-spolek
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Check signing secrets
        working-directory: .
        run: |
          missing=""
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Brak sekretów do podpisu:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Set version name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/radar-spolek-v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF#refs/tags/radar-spolek-v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - name: Build signed APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/RadarSpolek-$VERSION_NAME.apk"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: radar-spolek-release-apk
          path: radar-spolek/app/build/outputs/apk/release/RadarSpolek-*.apk
          if-no-files-found: error

      # Wersje z mastera i tagów publikowane jako GitHub Release – bezpośredni link do pobrania na telefonie.
      - name: Publish GitHub release
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/radar-spolek-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('radar-spolek-v{0}', env.VERSION_NAME) }}
          target_commitish: ${{ github.sha }}
          name: Radar Spółek ${{ env.VERSION_NAME }}
          make_latest: false
          body: |
            Podpisana wersja aplikacji Radar Spółek (Android 8.0+). Pobierz plik APK na telefonie i zainstaluj
            (wymaga zgody na instalację z nieznanych źródeł). To narzędzie filtrujące, nie porada inwestycyjna.
          files: radar-spolek/app/build/outputs/apk/release/RadarSpolek-${{ env.VERSION_NAME }}.apk
