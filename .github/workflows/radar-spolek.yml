name: Radar Spolek

on:
  push:
    branches: [master, "claude/radar-spolek**"]
    paths:
      - "radar-spolek/**"
      - ".github/workflows/radar-spolek.yml"
  pull_request:
    paths:
      - "radar-spolek/**"
      - ".github/workflows/radar-spolek.yml"
  workflow_dispatch:

concurrency:
  group: radar-spolek-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: radar-spolek

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: radar-spolek-apk
          path: radar-spolek/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Przy pushu (nie na PR) publikujemy APK jako GitHub Release – bezpośredni link do pobrania na telefonie.
      - name: Prepare release APK
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/RadarSpolek-1.0.${{ github.run_number }}.apk"

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: radar-spolek-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Radar Spółek 1.0.${{ github.run_number }}
          prerelease: true
          make_latest: false
          body: |
            Wersja debug aplikacji Radar Spółek (Android 8.0+). Pobierz plik APK na telefonie i zainstaluj
            (wymaga zgody na instalację z nieznanych źródeł). To narzędzie filtrujące, nie porada inwestycyjna.
          files: radar-spolek/app/build/outputs/apk/debug/RadarSpolek-1.0.${{ github.run_number }}.apk

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: radar-spolek-reports
          path: radar-spolek/app/build/reports/
          if-no-files-found: ignore
