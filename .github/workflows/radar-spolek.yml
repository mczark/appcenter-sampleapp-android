name: Radar Spolek

on:
  push:
    branches: [master, "claude/radar-spolek**"]
    paths:
      - "radar-spolek/**"
      - ".github/workflows/radar-spolek.yml"
  pull_request:
    paths:
      - "radar-spolek/**"
      - ".github/workflows/radar-spolek.yml"
  workflow_dispatch:

concurrency:
  group: radar-spolek-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: radar-spolek

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: radar-spolek-apk
          path: radar-spolek/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: radar-spolek-reports
          path: radar-spolek/app/build/reports/
          if-no-files-found: ignore
